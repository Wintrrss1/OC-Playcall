<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OC Lab — CFB 27 Dynasty</title>
  <style>
:root {
  --bg:#0c0f13;
  --panel:#141920;
  --panel2:#1a2029;
  --line:#2b333e;
  --text:#f4f7fb;
  --muted:#9aa6b4;
  --accent:#d9ff47;
  --good:#7ee787;
  --warn:#ffd166;
  --bad:#ff7b72;
  --shadow:0 10px 30px rgba(0,0,0,.22);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.4}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:20px clamp(16px,4vw,44px);border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(12,15,19,.96);backdrop-filter:blur(12px);z-index:10}
.eyebrow{font-size:.72rem;letter-spacing:.16em;color:var(--muted);font-weight:800}.topbar h1{margin:2px 0 0;font-size:1.45rem}.season-pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:8px 12px;color:var(--accent);font-weight:800;font-size:.85rem}
.tabs{display:flex;gap:8px;padding:12px clamp(12px,4vw,44px);overflow:auto;border-bottom:1px solid var(--line);background:#0f1318;position:sticky;top:76px;z-index:9}.tab{border:0;background:transparent;color:var(--muted);padding:10px 12px;border-radius:10px;white-space:nowrap;font-weight:800}.tab.active{background:var(--panel2);color:var(--text)}
main{max-width:1200px;margin:0 auto;padding:22px clamp(14px,3vw,30px) 80px}.view{display:none}.view.active{display:block}
.grid{display:grid;gap:16px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.card h2,.card h3{margin:0 0 12px}.card h2{font-size:1.1rem}.card h3{font-size:.95rem}.muted{color:var(--muted)}.small{font-size:.83rem}.kicker{font-size:.72rem;letter-spacing:.12em;color:var(--accent);font-weight:900;text-transform:uppercase}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}.stack{display:grid;gap:10px}.divider{height:1px;background:var(--line);margin:14px 0}
label{display:grid;gap:6px;color:var(--muted);font-size:.82rem;font-weight:700}input,select,textarea{width:100%;background:#0f141a;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px 11px;outline:none}input:focus,select:focus,textarea:focus{border-color:#69788c}textarea{min-height:90px;resize:vertical}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:9px 12px;font-weight:800}.btn.primary{background:var(--accent);border-color:var(--accent);color:#111}.btn.ghost{background:transparent}.btn.danger{color:var(--bad)}.btn.small{padding:6px 9px;font-size:.78rem}.btn:disabled{opacity:.45;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#10151b;border-radius:999px;padding:5px 8px;font-size:.74rem;color:var(--muted);font-weight:800}.badge.accent{color:var(--accent)}.badge.good{color:var(--good)}.badge.warn{color:var(--warn)}
.metric{font-size:1.8rem;font-weight:900}.metric-label{font-size:.75rem;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.script{counter-reset:script;display:grid;gap:8px}.script-item{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;background:#10151b;border:1px solid var(--line);border-radius:12px;padding:9px 10px}.script-num{width:28px;height:28px;border-radius:8px;background:var(--panel2);display:grid;place-items:center;font-size:.75rem;font-weight:900;color:var(--accent)}.script-title{font-weight:850}.script-sub{font-size:.76rem;color:var(--muted)}.score{font-weight:900;color:var(--good);font-size:.8rem}
.toggle-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.toggle{border:1px solid var(--line);background:#10151b;color:var(--muted);border-radius:10px;padding:10px;text-align:left;font-weight:800}.toggle.active{border-color:var(--accent);color:var(--text);box-shadow:inset 0 0 0 1px var(--accent)}
.play-card{border:1px solid var(--line);background:#10151b;border-radius:12px;padding:12px}.play-card .title{font-weight:900}.play-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.play-actions{display:flex;gap:6px;margin-top:10px}.rating{font-size:.75rem;font-weight:900;color:var(--accent)}
.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;border-bottom:1px solid var(--line);padding:10px 8px;font-size:.83rem}.table th{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em}.table tr:last-child td{border-bottom:0}
.empty{border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted)}
.timeline{display:grid;gap:12px}.season-card{display:grid;grid-template-columns:90px 1fr;gap:12px}.year{font-weight:950;font-size:1.25rem;color:var(--accent)}
.toast{position:fixed;right:18px;bottom:18px;background:#202832;border:1px solid #3c4856;color:var(--text);padding:11px 14px;border-radius:10px;box-shadow:var(--shadow);z-index:50;font-weight:800;animation:fade 2.6s forwards}@keyframes fade{0%{opacity:0;transform:translateY(8px)}10%,85%{opacity:1;transform:none}100%{opacity:0}}
@media(max-width:760px){.grid.two,.grid.three{grid-template-columns:1fr}.topbar{padding:14px 16px}.tabs{top:66px}.toggle-grid{grid-template-columns:1fr}.season-card{grid-template-columns:1fr}.script-item{grid-template-columns:34px 1fr}.script-item .score{grid-column:2}.table{display:block;overflow:auto;white-space:nowrap}}

</style>
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">CFB 27 DYNASTY TOOL</div>
      <h1>OC Lab</h1>
    </div>
    <div class="season-pill" id="seasonPill">Akron · Year 1</div>
  </header>

  <nav class="tabs" aria-label="Main navigation">
    <button class="tab active" data-view="dashboard">Game Plan</button>
    <button class="tab" data-view="playbook">My Playbook</button>
    <button class="tab" data-view="opponents">Team Playbooks</button>
    <button class="tab" data-view="career">Career</button>
    <button class="tab" data-view="settings">Settings</button>
  </nav>

  <main>
    <section id="dashboard" class="view active"></section>
    <section id="playbook" class="view"></section>
    <section id="opponents" class="view"></section>
    <section id="career" class="view"></section>
    <section id="settings" class="view"></section>
  </main>

  <template id="toastTemplate"><div class="toast"></div></template>
  <script>
const DEFENSES = {
  "4-2-5": {family:"Nickel", notes:"Balanced five-DB structure. Stress box count, conflict defenders and fit discipline.", weights:{inside:2,perimeter:1,quick:2,cross:1,vertical:0,rpo:2,read:2,pa:1,screen:1}},
  "3-3-5": {family:"Odd", notes:"Movement and disguise. Stay patient with the run game and make second-level defenders declare.", weights:{inside:2,perimeter:1,quick:2,cross:2,vertical:0,rpo:2,read:2,pa:1,screen:2}},
  "3-3-5 Tite": {family:"Odd/Tite", notes:"Clogs interior gaps and compresses the box. Favor perimeter access, quick throws and horizontal stress.", weights:{inside:-1,perimeter:3,quick:2,cross:1,vertical:1,rpo:3,read:1,pa:0,screen:2}},
  "3-4": {family:"Odd", notes:"Heavier box with flexible edges. Force OLBs to defend space and use play action when safeties trigger.", weights:{inside:1,perimeter:2,quick:2,cross:2,vertical:1,rpo:1,read:2,pa:2,screen:2}},
  "3-4 Multiple": {family:"Multiple", notes:"Expect front variation. Lean on rules-based concepts that survive movement and disguise.", weights:{inside:1,perimeter:1,quick:3,cross:2,vertical:0,rpo:2,read:1,pa:1,screen:2}},
  "4-3": {family:"Even", notes:"Traditional four-down spacing. Create horizontal conflicts and make linebackers cover in space.", weights:{inside:1,perimeter:2,quick:2,cross:3,vertical:1,rpo:2,read:2,pa:2,screen:2}},
  "4-3 Multiple": {family:"Multiple", notes:"Can shift between sturdy boxes and nickel answers. Formation multiplicity is valuable.", weights:{inside:1,perimeter:2,quick:2,cross:2,vertical:1,rpo:2,read:1,pa:2,screen:2}},
  "3-2-6": {family:"Dime", notes:"Light box, six DBs. Make them prove they can fit the run before chasing explosives.", weights:{inside:4,perimeter:2,quick:1,cross:0,vertical:-1,rpo:2,read:2,pa:1,screen:0}},
  "Multiple": {family:"Multiple", notes:"Broad toolbox with no single structural assumption. Build the script to diagnose first, attack second.", weights:{inside:1,perimeter:1,quick:2,cross:2,vertical:1,rpo:2,read:1,pa:2,screen:1}}
};

const uid = () => (globalThis.crypto && crypto.randomUUID ? crypto.randomUUID() : `id-${Date.now()}-${Math.random().toString(16).slice(2)}`);

const STARTER_PLAYS = [
  {id:uid(),formation:"Gun Trips",name:"Inside Zone",type:"Run",concepts:["inside"],year:1,notes:"Base run. Establish box-count rules."},
  {id:uid(),formation:"Gun Trips",name:"Read Option",type:"Run",concepts:["inside","read"],year:1,notes:"Constraint when the edge chases the back."},
  {id:uid(),formation:"Gun Trips",name:"RPO Alert Bubble",type:"RPO",concepts:["rpo","perimeter","quick"],year:1,notes:"Access throw when numbers are favorable."},
  {id:uid(),formation:"Gun Trips",name:"Y Cross",type:"Pass",concepts:["cross"],year:1,notes:"Core intermediate progression."},
  {id:uid(),formation:"Gun Trips",name:"PA Deep Post",type:"Play Action",concepts:["pa","vertical"],year:1,notes:"Shot after safeties begin fitting run."},
  {id:uid(),formation:"Gun Bunch",name:"Mesh",type:"Pass",concepts:["cross","quick"],year:1,notes:"Man answer and reliable money-down concept."},
  {id:uid(),formation:"Gun Bunch",name:"Flood",type:"Pass",concepts:["perimeter"],year:1,notes:"Three-level sideline stretch."},
  {id:uid(),formation:"Gun Bunch",name:"HB Slip Screen",type:"Screen",concepts:["screen","quick"],year:1,notes:"Pressure answer."},
  {id:uid(),formation:"Gun Doubles",name:"Stick",type:"Pass",concepts:["quick"],year:1,notes:"Simple leverage read."},
  {id:uid(),formation:"Gun Doubles",name:"Counter",type:"Run",concepts:["inside"],year:1,notes:"Change the run picture without changing personnel."},
  {id:uid(),formation:"Gun Trips TE",name:"RPO Glance",type:"RPO",concepts:["rpo","inside","quick"],year:1,notes:"Punish second-level run support."},
  {id:uid(),formation:"Gun Trips TE",name:"Four Verticals",type:"Pass",concepts:["vertical"],year:1,notes:"Coverage identification and explosive access."},
  {id:uid(),formation:"Pistol Trips",name:"Inside Zone Split",type:"Run",concepts:["inside"],year:1,notes:"Downhill changeup."},
  {id:uid(),formation:"Pistol Trips",name:"PA Flood",type:"Play Action",concepts:["pa","perimeter"],year:1,notes:"Marry downhill action to the boot/flood family."},
  {id:uid(),formation:"Gun Empty",name:"QB Draw",type:"Run",concepts:["inside","read"],year:2,notes:"Future install for light boxes."},
  {id:uid(),formation:"Gun Tight",name:"Mills",type:"Pass",concepts:["vertical","cross"],year:2,notes:"Future explosive concept versus middle-field structures."}
];

const DEFAULT_TEAMS = ["Akron","Ball State","Bowling Green","Buffalo","Central Michigan","Eastern Michigan","Kent State","Miami (OH)","Northern Illinois","Ohio","Toledo","UMass","Western Michigan"];

function initialState(){
  return {
    profile:{coach:"Coach",school:"Akron",year:1,offense:"Multiple Spread"},
    plays:STARTER_PLAYS,
    opponents:DEFAULT_TEAMS.map(name=>({name,defense:""})),
    game:{opponent:"Bowling Green",defense:"4-2-5",scriptLength:12,adjustments:[]},
    seasons:[{year:1,school:"Akron",record:"",notes:"Build the base system: Trips, Bunch, Doubles, Trips TE, Pistol Trips."}]
  };
}

let state = loadState();
function loadState(){ try {return JSON.parse(localStorage.getItem("ocLabState")) || initialState()} catch {return initialState()} }
function saveState(){ localStorage.setItem("ocLabState",JSON.stringify(state)); renderAll(); }
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2700)}
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}

const adjustmentWeights = {
  "Heavy pressure":{quick:3,screen:4,cross:1,pa:-3,vertical:-2},
  "Mostly man":{cross:4,quick:2,perimeter:1},
  "Single-high":{vertical:2,cross:2,rpo:1},
  "Two-high":{inside:3,read:2,rpo:1,vertical:-1},
  "Light box":{inside:4,read:2,pa:1},
  "Heavy box":{perimeter:3,quick:2,rpo:3,inside:-2},
  "Edge crashing":{read:5,rpo:2,pa:1},
  "Corners off":{quick:4,rpo:2},
  "Safeties triggering":{pa:4,vertical:3}
};

function playScore(play, defense, adjustments=[]){
  let score=50;
  const w=DEFENSES[defense]?.weights || DEFENSES.Multiple.weights;
  play.concepts.forEach(c=>score+=(w[c]||0)*4);
  adjustments.forEach(a=>play.concepts.forEach(c=>score+=(adjustmentWeights[a]?.[c]||0)*3));
  if(play.type==="RPO") score += 2;
  if(play.name.includes("Read Option")) score += 1;
  score -= Math.max(0,(play.year-state.profile.year))*100;
  return Math.max(1,Math.min(99,Math.round(score)));
}
function activePlays(){return state.plays.filter(p=>p.year<=state.profile.year && !p.retired)}

function buildScript(){
  const plays=activePlays().map(p=>({...p,score:playScore(p,state.game.defense,state.game.adjustments)}));
  const desired=Math.max(6,Math.min(20,Number(state.game.scriptLength)||12));
  const chosen=[]; const usedForm={}; const usedConcept={};
  for(let i=0;i<desired;i++){
    const candidates=plays.filter(p=>chosen.filter(x=>x.id===p.id).length<2).map(p=>{
      let bonus=0;
      bonus += (usedForm[p.formation]||0)===0?6:-((usedForm[p.formation]||0)*2);
      p.concepts.forEach(c=> bonus += (usedConcept[c]||0)===0?2:-1);
      if(i<3 && p.type==="Run") bonus+=3;
      if(i===0 && p.type==="Run") bonus+=4;
      if(i>=3 && p.type==="Play Action") bonus+=2;
      return {...p,rank:p.score+bonus+Math.random()*2};
    }).sort((a,b)=>b.rank-a.rank);
    if(!candidates.length) break;
    const pick=candidates[0]; chosen.push(pick);
    usedForm[pick.formation]=(usedForm[pick.formation]||0)+1;
    pick.concepts.forEach(c=>usedConcept[c]=(usedConcept[c]||0)+1);
  }
  return chosen;
}

function renderDashboard(){
  const root=document.querySelector("#dashboard");
  const teamOptions=state.opponents.map(t=>`<option ${t.name===state.game.opponent?'selected':''}>${esc(t.name)}</option>`).join('');
  const defOptions=Object.keys(DEFENSES).map(d=>`<option ${d===state.game.defense?'selected':''}>${d}</option>`).join('');
  const script=buildScript();
  const topConcepts={};script.forEach(p=>p.concepts.forEach(c=>topConcepts[c]=(topConcepts[c]||0)+1));
  const concepts=Object.entries(topConcepts).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([c,n])=>`<span class="badge accent">${c} · ${n}</span>`).join('');
  root.innerHTML=`
    <div class="grid two">
      <div class="card">
        <div class="kicker">Weekly Scout</div><h2>${esc(state.profile.school)} vs ${esc(state.game.opponent)}</h2>
        <div class="grid two">
          <label>Opponent<select id="gameOpponent">${teamOptions}</select></label>
          <label>Defensive playbook<select id="gameDefense">${defOptions}</select></label>
        </div>
        <div class="divider"></div>
        <div class="row space"><div><div class="metric-label">Base family</div><div class="metric">${esc(DEFENSES[state.game.defense]?.family||"Multiple")}</div></div><span class="badge">${activePlays().length} installed plays</span></div>
        <p class="muted small">${esc(DEFENSES[state.game.defense]?.notes||"")}</p>
        <div class="row">${concepts}</div>
      </div>
      <div class="card">
        <div class="kicker">In-Game Adjustments</div><h2>What are you seeing?</h2>
        <div class="toggle-grid">${Object.keys(adjustmentWeights).map(a=>`<button class="toggle ${state.game.adjustments.includes(a)?'active':''}" data-adjust="${esc(a)}">${esc(a)}</button>`).join('')}</div>
        <div class="divider"></div><p class="muted small">Tap observations as the game unfolds. The script and best-call board will re-score around what you’re actually seeing.</p>
      </div>
    </div>
    <div class="card" style="margin-top:16px">
      <div class="row space"><div><div class="kicker">Opening Script</div><h2>First ${script.length} calls</h2></div><div class="row"><label style="width:110px">Length<input id="scriptLength" type="number" min="6" max="20" value="${state.game.scriptLength}"></label><button class="btn" id="regenScript">Rebuild</button></div></div>
      <div class="script">${script.map((p,i)=>`<div class="script-item"><div class="script-num">${i+1}</div><div><div class="script-title">${esc(p.formation)} — ${esc(p.name)}</div><div class="script-sub">${esc(p.type)} · ${p.concepts.join(' / ')}${p.notes?` · ${esc(p.notes)}`:''}</div></div><div class="score">${p.score}</div></div>`).join('')}</div>
    </div>
    <div class="card" style="margin-top:16px">
      <div class="kicker">Best Calls Right Now</div><h2>Adjustment board</h2>
      <div class="grid three">${activePlays().map(p=>({...p,score:playScore(p,state.game.defense,state.game.adjustments)})).sort((a,b)=>b.score-a.score).slice(0,9).map(p=>playCard(p,false)).join('')}</div>
    </div>`;
  document.querySelector('#gameOpponent').onchange=e=>{state.game.opponent=e.target.value;const map=state.opponents.find(x=>x.name===e.target.value);if(map?.defense) state.game.defense=map.defense;saveState()};
  document.querySelector('#gameDefense').onchange=e=>{state.game.defense=e.target.value;const map=state.opponents.find(x=>x.name===state.game.opponent);if(map)map.defense=e.target.value;saveState()};
  document.querySelector('#scriptLength').onchange=e=>{state.game.scriptLength=e.target.value;saveState()};
  document.querySelector('#regenScript').onclick=()=>renderDashboard();
  document.querySelectorAll('[data-adjust]').forEach(b=>b.onclick=()=>{const a=b.dataset.adjust;state.game.adjustments=state.game.adjustments.includes(a)?state.game.adjustments.filter(x=>x!==a):[...state.game.adjustments,a];saveState()});
}

function playCard(p,editable=true){return `<div class="play-card"><div class="row space"><div class="title">${esc(p.name)}</div>${p.score?`<div class="rating">${p.score}</div>`:''}</div><div class="muted small">${esc(p.formation)}</div><div class="play-meta"><span class="badge">${esc(p.type)}</span><span class="badge">Year ${p.year}</span>${p.concepts.map(c=>`<span class="badge">${esc(c)}</span>`).join('')}</div>${editable?`<div class="play-actions"><button class="btn small" data-edit-play="${p.id}">Edit</button><button class="btn small danger" data-retire-play="${p.id}">${p.retired?'Restore':'Retire'}</button></div>`:''}</div>`}

function renderPlaybook(){
  const root=document.querySelector('#playbook');
  const formations=[...new Set(state.plays.filter(p=>!p.retired).map(p=>p.formation))].sort();
  root.innerHTML=`<div class="grid two">
    <div class="card"><div class="kicker">Current System</div><h2>${esc(state.profile.offense)}</h2><div class="row"><span class="badge accent">${activePlays().length} active</span><span class="badge">${formations.length} formations</span><span class="badge">Year ${state.profile.year}</span></div><p class="muted small">Plays with a future install year stay in the library but do not appear in weekly scripts until that season.</p></div>
    <div class="card"><div class="kicker">Install</div><h2>Add a concept</h2><form id="playForm" class="stack"><div class="grid two"><label>Formation<input name="formation" required placeholder="Gun Trips"></label><label>Play name<input name="name" required placeholder="Drive"></label></div><div class="grid two"><label>Type<select name="type"><option>Run</option><option>Pass</option><option>RPO</option><option>Play Action</option><option>Screen</option></select></label><label>Install year<input name="year" type="number" min="1" value="${state.profile.year}"></label></div><label>Concept tags<input name="concepts" placeholder="quick,cross (use: inside, perimeter, quick, cross, vertical, rpo, read, pa, screen)"></label><label>Notes<input name="notes" placeholder="What is this call for?"></label><button class="btn primary">Install play</button></form></div>
  </div><div class="card" style="margin-top:16px"><div class="row space"><div><div class="kicker">Playbook</div><h2>Installed + future concepts</h2></div><select id="formationFilter" style="max-width:220px"><option value="">All formations</option>${formations.map(f=>`<option>${esc(f)}</option>`).join('')}</select></div><div id="playGrid" class="grid three" style="margin-top:12px"></div></div>`;
  const draw=()=>{const f=document.querySelector('#formationFilter').value;document.querySelector('#playGrid').innerHTML=state.plays.filter(p=>!f||p.formation===f).sort((a,b)=>a.year-b.year||a.formation.localeCompare(b.formation)).map(p=>playCard(p,true)).join('')||`<div class="empty">No plays in this filter.</div>`;bindPlayActions()}; draw();
  document.querySelector('#formationFilter').onchange=draw;
  document.querySelector('#playForm').onsubmit=e=>{e.preventDefault();const d=new FormData(e.target);state.plays.push({id:uid(),formation:d.get('formation').trim(),name:d.get('name').trim(),type:d.get('type'),year:Number(d.get('year'))||state.profile.year,concepts:d.get('concepts').split(',').map(x=>x.trim().toLowerCase()).filter(Boolean),notes:d.get('notes').trim()});saveState();toast('Play installed')};
}
function bindPlayActions(){
  document.querySelectorAll('[data-retire-play]').forEach(b=>b.onclick=()=>{const p=state.plays.find(x=>x.id===b.dataset.retirePlay);p.retired=!p.retired;saveState()});
  document.querySelectorAll('[data-edit-play]').forEach(b=>b.onclick=()=>{const p=state.plays.find(x=>x.id===b.dataset.editPlay);const name=prompt('Play name',p.name);if(name===null)return;const form=prompt('Formation',p.formation);if(form===null)return;const tags=prompt('Concept tags, comma separated',p.concepts.join(','));if(tags===null)return;p.name=name.trim()||p.name;p.formation=form.trim()||p.formation;p.concepts=tags.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);saveState()});
}

function renderOpponents(){
  const root=document.querySelector('#opponents');
  root.innerHTML=`<div class="grid two"><div class="card"><div class="kicker">Opponent Library</div><h2>Team → defensive playbook</h2><p class="muted small">Save each team’s current defensive playbook here. Weekly scouting then loads the correct structure automatically.</p><form id="oppForm" class="row"><input name="name" required placeholder="Team name" style="flex:1"><select name="defense" style="flex:1">${Object.keys(DEFENSES).map(d=>`<option>${d}</option>`).join('')}</select><button class="btn primary">Add / update</button></form></div><div class="card"><div class="kicker">Why editable?</div><h2>Keep the dynasty current</h2><p class="muted small">Team defaults can change after game updates. This library is intentionally yours to correct once, then reuse for every future matchup.</p></div></div>
  <div class="card" style="margin-top:16px"><table class="table"><thead><tr><th>Team</th><th>Defensive playbook</th><th></th></tr></thead><tbody>${state.opponents.sort((a,b)=>a.name.localeCompare(b.name)).map((t,i)=>`<tr><td>${esc(t.name)}</td><td><select data-team-defense="${esc(t.name)}"><option value="">Not set</option>${Object.keys(DEFENSES).map(d=>`<option ${d===t.defense?'selected':''}>${d}</option>`).join('')}</select></td><td><button class="btn small danger" data-remove-team="${esc(t.name)}">Remove</button></td></tr>`).join('')}</tbody></table></div>`;
  document.querySelector('#oppForm').onsubmit=e=>{e.preventDefault();const d=new FormData(e.target),name=d.get('name').trim(),defense=d.get('defense');const existing=state.opponents.find(x=>x.name.toLowerCase()===name.toLowerCase());if(existing){existing.defense=defense;existing.name=name}else state.opponents.push({name,defense});saveState();toast('Team playbook saved')};
  document.querySelectorAll('[data-team-defense]').forEach(s=>s.onchange=()=>{state.opponents.find(x=>x.name===s.dataset.teamDefense).defense=s.value;saveState()});
  document.querySelectorAll('[data-remove-team]').forEach(b=>b.onclick=()=>{state.opponents=state.opponents.filter(x=>x.name!==b.dataset.removeTeam);saveState()});
}

function renderCareer(){
  const root=document.querySelector('#career');
  const future=state.plays.filter(p=>p.year>state.profile.year&&!p.retired).sort((a,b)=>a.year-b.year);
  root.innerHTML=`<div class="grid two"><div class="card"><div class="kicker">Scheme Evolution</div><h2>Advance the offense by season</h2><p class="muted small">When you advance a year, future installs become eligible for scripts automatically. Add packages now and assign the season you want your coach to “discover” them.</p><button class="btn primary" id="advanceYear">Advance to Year ${state.profile.year+1}</button></div><div class="card"><div class="kicker">Next Installs</div><h2>${future.length?future.length+' concepts queued':'Nothing queued'}</h2>${future.slice(0,5).map(p=>`<div class="row space"><span>${esc(p.formation)} — ${esc(p.name)}</span><span class="badge">Y${p.year}</span></div>`).join('')||'<p class="muted small">Use My Playbook to add future concepts.</p>'}</div></div>
  <div class="card" style="margin-top:16px"><div class="row space"><div><div class="kicker">Career Log</div><h2>Your coaching tree starts here</h2></div><button class="btn" id="addSeasonNote">Add note</button></div><div class="timeline">${state.seasons.map(s=>`<div class="season-card"><div class="year">Year ${s.year}</div><div><div class="row"><strong>${esc(s.school)}</strong>${s.record?`<span class="badge">${esc(s.record)}</span>`:''}</div><div class="muted small">${esc(s.notes||'')}</div></div></div>`).join('')}</div></div>`;
  document.querySelector('#advanceYear').onclick=()=>{state.profile.year++;state.seasons.push({year:state.profile.year,school:state.profile.school,record:"",notes:""});saveState();toast(`Year ${state.profile.year} unlocked`)};
  document.querySelector('#addSeasonNote').onclick=()=>{let s=state.seasons.find(x=>x.year===state.profile.year);if(!s){s={year:state.profile.year,school:state.profile.school,record:"",notes:""};state.seasons.push(s)}const record=prompt('Season record (optional)',s.record||'');if(record===null)return;const notes=prompt('Season / scheme notes',s.notes||'');if(notes===null)return;s.record=record;s.notes=notes;saveState()};
}

function renderSettings(){
  const root=document.querySelector('#settings');
  root.innerHTML=`<div class="grid two"><div class="card"><div class="kicker">Dynasty</div><h2>Coach profile</h2><form id="profileForm" class="stack"><label>Coach<input name="coach" value="${esc(state.profile.coach)}"></label><label>School<input name="school" value="${esc(state.profile.school)}"></label><label>Offensive identity<input name="offense" value="${esc(state.profile.offense)}"></label><label>Current year<input name="year" type="number" min="1" value="${state.profile.year}"></label><button class="btn primary">Save profile</button></form></div><div class="card"><div class="kicker">Data</div><h2>Backup / move devices</h2><p class="muted small">Everything is saved in this browser. Export a JSON backup if you want to preserve your dynasty or move it to another device.</p><div class="stack"><button class="btn" id="exportData">Export dynasty JSON</button><label>Import JSON<input id="importFile" type="file" accept="application/json"></label><button class="btn danger" id="resetData">Reset app</button></div></div></div>`;
  document.querySelector('#profileForm').onsubmit=e=>{e.preventDefault();const d=new FormData(e.target);state.profile={coach:d.get('coach'),school:d.get('school'),offense:d.get('offense'),year:Number(d.get('year'))||1};saveState();toast('Profile saved')};
  document.querySelector('#exportData').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='oc-lab-dynasty.json';a.click();URL.revokeObjectURL(a.href)};
  document.querySelector('#importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const x=JSON.parse(await f.text());state=x;saveState();toast('Dynasty imported')}catch{alert('That file is not valid OC Lab JSON.')}};
  document.querySelector('#resetData').onclick=()=>{if(confirm('Reset all OC Lab data?')){state=initialState();saveState();toast('App reset')}};
}

function renderAll(){
  document.querySelector('#seasonPill').textContent=`${state.profile.school} · Year ${state.profile.year}`;
  renderDashboard();renderPlaybook();renderOpponents();renderCareer();renderSettings();
}

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===b.dataset.view));});
renderAll();

</script>
</body>
</html>
