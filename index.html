<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OC Lab — CFB 27 Offensive Game Planner</title>
<style>
:root{
  --bg:#0c1015;--panel:#141a21;--panel2:#19212b;--line:#2a3441;--text:#f5f7fb;--muted:#9aa7b6;
  --accent:#d8a519;--accent2:#f2c94c;--good:#77d68c;--warn:#ffd166;--bad:#ff7b72;--paper:#fbfbfa;--ink:#1f2329;
}
*{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}.appbar{position:sticky;top:0;z-index:20;background:rgba(12,16,21,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.appbar-inner{max-width:1380px;margin:auto;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:14px}.brand .eyebrow{font-size:.68rem;letter-spacing:.2em;color:var(--accent2);font-weight:900}.brand h1{font-size:1.25rem;margin:2px 0 0}.pill{border:1px solid var(--line);background:var(--panel2);padding:7px 10px;border-radius:999px;color:var(--accent2);font-size:.8rem;font-weight:800}
.tabs{max-width:1380px;margin:auto;display:flex;gap:6px;padding:0 14px 10px;overflow:auto}.tab{border:0;background:transparent;color:var(--muted);font-weight:800;padding:9px 11px;border-radius:9px;white-space:nowrap;cursor:pointer}.tab.active{background:var(--panel2);color:var(--text)}
main{max-width:1380px;margin:auto;padding:20px 16px 80px}.view{display:none}.view.active{display:block}.grid{display:grid;gap:14px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}.card h2,.card h3{margin:0 0 12px}.card h2{font-size:1.05rem}.card h3{font-size:.92rem}.muted{color:var(--muted)}.small{font-size:.8rem}.kicker{font-size:.68rem;letter-spacing:.15em;color:var(--accent2);font-weight:900;text-transform:uppercase}.stack{display:grid;gap:10px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}.divider{height:1px;background:var(--line);margin:13px 0}
label{display:grid;gap:6px;color:var(--muted);font-size:.78rem;font-weight:800} input,select,textarea{width:100%;background:#0f151c;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 11px;outline:none} textarea{min-height:80px;resize:vertical} input:focus,select:focus,textarea:focus{border-color:#65788f}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:9px 12px;font-weight:850}.btn.primary{background:var(--accent2);border-color:var(--accent2);color:#111}.btn.ghost{background:transparent}.btn.danger{color:var(--bad)}.btn.small{padding:6px 8px;font-size:.75rem}.btn:hover{filter:brightness(1.05)}
.toggle-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.toggle{border:1px solid var(--line);background:#10161d;color:var(--muted);border-radius:10px;padding:9px 10px;text-align:left;font-weight:800;cursor:pointer}.toggle.active{border-color:var(--accent2);color:var(--text);box-shadow:inset 0 0 0 1px var(--accent2)}
.badge{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:#10161d;border-radius:999px;padding:4px 7px;font-size:.7rem;color:var(--muted);font-weight:850}.badge.good{color:var(--good)}.badge.accent{color:var(--accent2)}.badge.warn{color:var(--warn)}
.metric{font-size:1.8rem;font-weight:950}.metric-label{font-size:.7rem;letter-spacing:.08em;color:var(--muted);font-weight:850;text-transform:uppercase}.call-card{border:1px solid var(--line);background:#10161d;border-radius:12px;padding:11px}.call-title{font-weight:900}.call-sub{font-size:.76rem;color:var(--muted);margin-top:2px}.fit{font-weight:950;color:var(--good)}
.table{width:100%;border-collapse:collapse}.table th,.table td{border-bottom:1px solid var(--line);padding:9px 7px;text-align:left;font-size:.8rem;vertical-align:top}.table th{font-size:.69rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}.table tr:last-child td{border-bottom:0}.empty{border:1px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--muted)}
.play-list{display:grid;gap:8px}.play-row{display:grid;grid-template-columns:1.2fr 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);background:#10161d;border-radius:11px;padding:10px}.formation{font-size:.72rem;color:var(--accent2);font-weight:900}.playname{font-weight:900}.tags{display:flex;gap:5px;flex-wrap:wrap}
.notice{border-left:3px solid var(--accent2);padding:9px 11px;background:#111820;border-radius:8px;color:#d5dce5;font-size:.82rem}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toast{position:fixed;right:18px;bottom:18px;background:#202832;border:1px solid #3a4654;padding:10px 13px;border-radius:10px;font-weight:800;z-index:50;animation:fade 2.6s forwards}@keyframes fade{0%{opacity:0;transform:translateY(8px)}10%,85%{opacity:1;transform:none}100%{opacity:0}}

/* Printable call sheet */
.sheet-wrap{display:grid;gap:18px}.sheet{background:var(--paper);color:var(--ink);width:100%;max-width:1150px;margin:auto;min-height:1480px;padding:42px 46px;box-shadow:0 14px 40px rgba(0,0,0,.25)}.sheet-header{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;border-bottom:3px solid #c69614;padding-bottom:12px;margin-bottom:14px}.sheet-brand{font-size:.72rem;letter-spacing:.25em;color:#a97700;font-weight:900}.sheet h1{margin:2px 0 0;font-size:1.6rem;letter-spacing:-.02em}.sheet-meta{text-align:right;font-size:.74rem;color:#526173}.sheet-section-title{background:#141920;color:#fff;padding:7px 10px;font-size:.72rem;letter-spacing:.16em;font-weight:900;text-transform:uppercase;margin-bottom:8px}.sheet-grid{display:grid;grid-template-columns:290px 1fr;gap:18px}.profile-list{display:grid;gap:11px}.profile-label{font-size:.66rem;color:#9b6d00;font-weight:900;letter-spacing:.11em;text-transform:uppercase}.profile-value{font-size:.82rem;font-weight:800;margin-top:2px}.profile-bullets{margin:4px 0 0;padding-left:17px;font-size:.75rem;line-height:1.45}.formation-item{margin-bottom:14px}.formation-top{display:flex;justify-content:space-between;gap:8px}.formation-rank{font-weight:950;color:#314f77}.formation-name{font-weight:950;font-size:.83rem}.formation-share{font-weight:950;color:#c18b00}.formation-note{font-size:.71rem;line-height:1.45;color:#4d5662;margin-top:4px}.matrix{width:100%;border-collapse:collapse}.matrix th{background:#141920;color:#fff;padding:7px 8px;font-size:.64rem;letter-spacing:.08em;text-align:left}.matrix td{border:1px solid #ccd3dc;padding:7px 8px;vertical-align:top}.matrix .sit{font-weight:950;color:#365f89;font-size:.73rem;white-space:nowrap}.matrix .call{font-weight:950;color:#315d95;font-size:.72rem}.matrix .play{font-size:.68rem;color:#56616f;margin-top:1px}.matrix .pct{font-weight:950;color:#2d7d55;font-size:.8rem}.matrix .note-row td{background:#f6f0df;color:#5b4b25;font-size:.65rem;font-style:italic;padding:5px 7px}.guide-item{border-bottom:1px solid #d7dde5;padding:10px 0}.guide-item:last-child{border-bottom:0}.guide-sit{font-weight:950;color:#3a628a;font-size:.82rem}.guide-call{font-size:.72rem;font-weight:900;color:#2f5f99;margin-top:2px}.guide-label{font-size:.62rem;color:#a97700;font-weight:950;letter-spacing:.1em;margin-top:5px}.guide-text{font-size:.7rem;color:#4c5867;line-height:1.45;margin-top:2px}.script-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.script-box{border:1px solid #ccd3dc;padding:8px}.script-num{font-size:.62rem;font-weight:950;color:#a97700}.script-call{font-size:.75rem;font-weight:950;color:#294f7e}.script-check{font-size:.65rem;color:#5e6875;margin-top:2px}.footer{margin-top:18px;border-top:1px solid #cfd5dc;padding-top:7px;font-size:.62rem;color:#87909b;display:flex;justify-content:space-between}
@media(max-width:820px){.two,.three{grid-template-columns:1fr}.toggle-grid{grid-template-columns:1fr}.play-row{grid-template-columns:1fr}.sheet{padding:26px 22px;min-height:auto}.sheet-grid{grid-template-columns:1fr}.sheet-header{align-items:flex-start}.sheet-meta{text-align:left}.script-grid{grid-template-columns:1fr}}
@media print{body{background:#fff}.appbar,main>.view:not(#callsheet),#callsheet>.no-print,.toolbar{display:none!important}main{padding:0;max-width:none}.view{display:none!important}#callsheet{display:block!important}.sheet-wrap{gap:0}.sheet{box-shadow:none;max-width:none;width:100%;min-height:0;page-break-after:always;padding:28px 34px}.sheet:last-child{page-break-after:auto}@page{size:letter portrait;margin:.35in}}
</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-inner">
    <div class="brand"><div class="eyebrow">CFB 27 OFFENSIVE GAME PREP</div><h1>OC Lab</h1></div>
    <div class="pill" id="headerPill">Akron · Ohio State</div>
  </div>
  <nav class="tabs">
    <button class="tab active" data-view="planner">Game Planner</button>
    <button class="tab" data-view="callsheet">Call Sheet</button>
    <button class="tab" data-view="offense">My Offense</button>
    <button class="tab" data-view="live">In-Game</button>
  </nav>
</header>
<main>
<section id="planner" class="view active"></section>
<section id="callsheet" class="view"></section>
<section id="offense" class="view"></section>
<section id="live" class="view"></section>
</main>
<script>
const uid=()=>globalThis.crypto?.randomUUID?.()||`id-${Date.now()}-${Math.random().toString(16).slice(2)}`;
const SITUATIONS=[
  {id:'1s',label:'1ST & SHORT',kind:'short',down:1},{id:'1m',label:'1ST & MEDIUM',kind:'medium',down:1},{id:'1l',label:'1ST & LONG',kind:'long',down:1},
  {id:'2s',label:'2ND & SHORT',kind:'short',down:2},{id:'2m',label:'2ND & MEDIUM',kind:'medium',down:2},{id:'2l',label:'2ND & LONG',kind:'long',down:2},
  {id:'3s',label:'3RD & SHORT',kind:'short',down:3},{id:'3m',label:'3RD & MEDIUM',kind:'medium',down:3},{id:'3l',label:'3RD & LONG',kind:'long',down:3},
  {id:'4s',label:'4TH & SHORT',kind:'short',down:4},{id:'4l',label:'4TH & LONG',kind:'long',down:4},{id:'gl',label:'GOAL LINE',kind:'goal',down:0},{id:'2min',label:'2-MINUTE',kind:'twomin',down:0}
];
const DEF_PRESETS={
  '4-2-5 Zone Pressure':{front:'4-2-5',coverage:'Zone',pressure:'High',notes:'Nickel structure with zone pressure. Make underneath defenders declare and punish pressure without holding the ball.',weights:{zone:8,man:-1,pressure:10,quick:8,screen:10,run:1,bunch:2,shot:-5,rpo:3,cross:2}},
  '4-2-5 Man':{front:'4-2-5',coverage:'Man',pressure:'Medium',notes:'Five-DB man structure. Use bunch, traffic, crossers and matchup throws. Run when the box stays light.',weights:{zone:-2,man:10,pressure:3,quick:4,screen:3,run:4,bunch:9,shot:3,rpo:1,cross:10}},
  '4-2-5 Base':{front:'4-2-5',coverage:'Mixed',pressure:'Medium',notes:'Balanced nickel front. Stay multiple and let box count, leverage and safety shell determine the answer.',weights:{zone:3,man:3,pressure:3,quick:4,screen:3,run:3,bunch:3,shot:1,rpo:3,cross:3}},
  '4-3 Zone':{front:'4-3',coverage:'Zone',pressure:'Low',notes:'Four-down zone structure. Stress linebackers horizontally and attack windows with spacing/flood concepts.',weights:{zone:9,man:-2,pressure:-1,quick:6,screen:1,run:2,bunch:2,shot:1,rpo:4,cross:5}},
  '3-3-5':{front:'3-3-5',coverage:'Mixed',pressure:'Medium',notes:'Odd stack with disguise and movement. Favor simple rules, quick game and runs that punish light boxes.',weights:{zone:4,man:2,pressure:5,quick:6,screen:6,run:5,bunch:3,shot:-1,rpo:5,cross:4}},
  '3-3-5 Tite':{front:'3-3-5 Tite',coverage:'Mixed',pressure:'Medium',notes:'Interior-clogging odd front. Get the ball outside, use access throws and avoid living on inside runs.',weights:{zone:3,man:2,pressure:4,quick:7,screen:6,run:-2,perimeter:10,bunch:3,shot:0,rpo:8,cross:4}},
  'Multiple':{front:'Multiple',coverage:'Mixed',pressure:'Medium',notes:'Multiple structure. The first series should diagnose coverage, pressure and box count before specializing.',weights:{zone:2,man:2,pressure:3,quick:5,screen:4,run:3,bunch:3,shot:1,rpo:4,cross:4}}
};
const STARTER_PLAYS=[
 {formation:'Gun Bunch Open',name:'X Spot',type:'Pass',tags:['zone','man','quick','bunch','simple'],read:'Pick a side. Flat defender widens → Spot. He sits inside → flat.'},
 {formation:'Gun Bunch Open',name:'Spacing',type:'Pass',tags:['zone','quick','bunch','simple'],read:'Choose one side pre-snap. Take cushion; do not scan the whole field.'},
 {formation:'Gun Bunch Open',name:'Bunch Flood',type:'Pass',tags:['zone','bunch','perimeter'],read:'Read the sideline triangle short-to-deep. Throw away if capped.'},
 {formation:'Gun Bunch Open',name:'HB Slip Screen',type:'Screen',tags:['pressure','screen','quick','simple'],read:'Best when pressure is real. Invite rush, then dump to the back.'},
 {formation:'Gun Bunch Open',name:'Read Option',type:'Run',tags:['run','rpo','perimeter'],read:'Edge crashes on RB → keep. Edge sits → give.'},
 {formation:'Gun Trips TE',name:'HB Counter',type:'Run',tags:['run','man','simple'],read:'Use vs light/neutral box. Good answer when second level widens.'},
 {formation:'Gun Trips TE',name:'Inside Zone',type:'Run',tags:['run','simple'],read:'Box-count run. Do not force it into a loaded interior.'},
 {formation:'Gun Trips TE',name:'Verticals',type:'Pass',tags:['man','shot'],read:'Use when press/man or single-high gives a matchup. Get off it quickly if leverage is lost.'},
 {formation:'Gun Trips TE',name:'RPO Alert Bubble',type:'RPO',tags:['rpo','zone','quick','perimeter','simple'],read:'Numbers/access throw first. Hand it off if apex stays wide.'},
 {formation:'Gun Trips TE',name:'Drive Post',type:'Pass',tags:['man','cross','shot'],read:'Use selectively. Favor the underneath crosser unless the post clearly wins.'},
 {formation:'Gun Normal Y Off',name:'Inside Zone',type:'Run',tags:['run','simple'],read:'Run at a favorable box; pair with quick access when overhang cheats in.'},
 {formation:'Gun Normal Y Off',name:'RPO Peek Slant',type:'RPO',tags:['rpo','zone','quick','simple'],read:'Conflict LB crashes → slant. LB sits in lane → hand it off.'},
 {formation:'Gun Normal Y Off',name:'Y Shallow Cross',type:'Pass',tags:['man','cross'],read:'Use mainly as a man answer. Do not try to throw over a stationary MLB.'},
 {formation:'Gun Normal Y Off',name:'Four Verticals',type:'Pass',tags:['man','shot'],read:'Pick the matchup before snap. If it is not clearly won, outlet/check down.'}
].map(p=>({id:uid(),enabled:true,...p}));
function initial(){return {profile:{school:'Akron',playbook:'Ohio State',opponent:'UMass',defense:'4-2-5 Man',weather:'27°F, dry/cold',runStyle:'Balanced',passStyle:'Quick / intermediate',qb:'Pocket passer',ol:'Below average',notes:''},observations:[],plays:STARTER_PLAYS};}
let state=load();
function load(){try{return JSON.parse(localStorage.getItem('oclab_v2'))||initial()}catch{return initial()}}
function save(){localStorage.setItem('oclab_v2',JSON.stringify(state));renderAll()}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2700)}
function bindTabs(){document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.view).classList.add('active')})}
function preset(){return DEF_PRESETS[state.profile.defense]||DEF_PRESETS.Multiple}
function stableHash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}
function situationScore(play,sit){let n=0;const t=play.tags;
 if(sit.kind==='short'){if(t.includes('run'))n+=8;if(t.includes('quick'))n+=7;if(t.includes('shot'))n-=5}
 if(sit.kind==='medium'){if(t.includes('quick'))n+=5;if(t.includes('cross'))n+=4;if(t.includes('run'))n+=3}
 if(sit.kind==='long'){if(t.includes('quick'))n+=5;if(t.includes('cross'))n+=6;if(t.includes('screen'))n+=5;if(t.includes('run'))n-=6;if(t.includes('shot'))n+=1}
 if(sit.kind==='goal'){if(t.includes('run'))n+=8;if(t.includes('man'))n+=4;if(t.includes('shot'))n-=8}
 if(sit.kind==='twomin'){if(t.includes('quick'))n+=9;if(t.includes('perimeter'))n+=5;if(t.includes('run'))n-=4;if(t.includes('screen'))n+=3}
 if(sit.down===3||sit.down===4){if(t.includes('simple'))n+=4;if(t.includes('run')&&sit.kind!=='short')n-=5}
 return n;
}
function liveWeight(play){let n=0;for(const o of state.observations){
 if(o==='softCorners'&&play.tags.includes('zone'))n+=8;
 if(o==='manHeavy'&&play.tags.includes('man'))n+=10;
 if(o==='pressureHot'&&(play.tags.includes('pressure')||play.tags.includes('screen')||play.tags.includes('quick')))n+=9;
 if(o==='lightBox'&&play.tags.includes('run'))n+=10;
 if(o==='lbsCrash'&&play.tags.includes('rpo'))n+=9;
 if(o==='edgeCrash'&&play.name.includes('Read Option'))n+=12;
 if(o==='safetiesSquat'&&play.tags.includes('shot'))n+=9;
 if(o==='twoHigh'&&play.tags.includes('run'))n+=6;
 }
 return n;
}
function score(play,sit){const p=preset();let n=58;for(const tag of play.tags)n+=p.weights[tag]||0;n+=situationScore(play,sit)+liveWeight(play);
 if(state.profile.ol==='Below average'&&play.tags.includes('shot'))n-=8;
 if(state.profile.qb==='Pocket passer'&&play.name.includes('Read Option'))n-=4;
 if(state.profile.passStyle.includes('Quick')&&play.tags.includes('quick'))n+=3;
 n+=(stableHash(play.name+sit.id+state.profile.defense)%5)-2;
 return Math.max(42,Math.min(96,Math.round(n)));
}
function rankedFor(sit){return state.plays.filter(p=>p.enabled).map(p=>({...p,fit:score(p,sit)})).sort((a,b)=>b.fit-a.fit)}
function matrix(){return SITUATIONS.map(s=>{const r=rankedFor(s);return {sit:s,primary:r[0],secondary:r.find(x=>x.formation!==r[0]?.formation)||r[1]}})}
function formationRanks(){const map={};for(const p of state.plays.filter(x=>x.enabled)){const vals=SITUATIONS.slice(0,9).map(s=>score(p,s));(map[p.formation]??=[]).push(...vals)}return Object.entries(map).map(([name,vals])=>({name,avg:Math.round(vals.reduce((a,b)=>a+b,0)/vals.length)})).sort((a,b)=>b.avg-a.avg).slice(0,4)}
function callNote(sit,p){const d=state.profile.defense;const tags=p.tags;
 if(sit.kind==='short'&&tags.includes('run'))return 'Use the box count. If a safety inserts or the nickel folds inside, move to the quick access throw.';
 if(tags.includes('screen'))return 'Use when pressure is actually coming. If they bluff and drop, get out of it or take the easy outlet.';
 if(tags.includes('shot'))return 'Shot call only when leverage confirms it. Do not hold the ball waiting for a route to become open.';
 if(tags.includes('rpo'))return 'Read one conflict defender. If he stays in the throwing lane, hand the ball off.';
 if(tags.includes('quick'))return d.includes('Man')?'Win leverage immediately. Pick the matchup/side before the snap and throw on time.':'Take the underneath access the defense gives you. One-side read; no full-field scan.';
 if(tags.includes('run'))return 'Run only into a favorable box. If second-level defenders widen, stay patient and make them fit the run.';
 return 'Use the concept as a matchup call, not an automatic sequence. Confirm leverage after the snap.';
}
function openingScript(){const desired=[['diagnose','quick'],['run','run'],['diagnose','zone'],['pressure','screen'],['man','man'],['rpo','rpo'],['run2','run'],['shot','shot'],['quick2','quick'],['perim','perimeter'],['best','simple'],['counter','run']];const used=[];return desired.map(([,tag],i)=>{let pool=state.plays.filter(p=>p.enabled&&p.tags.includes(tag)&&!used.includes(p.id));if(!pool.length)pool=state.plays.filter(p=>p.enabled&&!used.includes(p.id));const sit=i<4?SITUATIONS[1]:i<8?SITUATIONS[4]:SITUATIONS[7];pool=pool.map(p=>({...p,fit:score(p,sit)})).sort((a,b)=>b.fit-a.fit);const p=pool[0];if(p)used.push(p.id);return p}).filter(Boolean)}
function coachSummary(){const p=preset();const obs=state.observations.length?` Live observations are active: ${state.observations.map(obsLabel).join(', ')}.`:'';return `${p.notes} With ${state.profile.qb.toLowerCase()} QB play and a ${state.profile.ol.toLowerCase()} OL, favor calls that get the ball out on time and avoid unnecessary long-developing reads.${obs}`}
function obsLabel(x){return ({softCorners:'soft corners',manHeavy:'man showing often',pressureHot:'pressure getting home',lightBox:'light box',lbsCrash:'LBs crashing',edgeCrash:'edge crashing',safetiesSquat:'safeties squatting',twoHigh:'two-high shell'})[x]||x}
function renderPlanner(){const p=state.profile;document.getElementById('planner').innerHTML=`
<div class="grid two"><div class="card"><div class="kicker">Week Setup</div><h2>Build the opponent profile</h2><div class="grid two">
<label>Your school<input id="school" value="${esc(p.school)}"></label><label>Offensive playbook<input id="playbook" value="${esc(p.playbook)}"></label>
<label>Opponent<input id="opponent" value="${esc(p.opponent)}"></label><label>Defense<select id="defense">${Object.keys(DEF_PRESETS).map(x=>`<option ${x===p.defense?'selected':''}>${x}</option>`).join('')}</select></label>
<label>Weather / conditions<input id="weather" value="${esc(p.weather)}"></label><label>QB profile<select id="qb">${['Pocket passer','Pass-first mobile','Dual threat'].map(x=>`<option ${x===p.qb?'selected':''}>${x}</option>`).join('')}</select></label>
<label>OL quality<select id="ol">${['Below average','Average','Strong'].map(x=>`<option ${x===p.ol?'selected':''}>${x}</option>`).join('')}</select></label><label>Pass identity<select id="passStyle">${['Quick / intermediate','Balanced','Vertical'].map(x=>`<option ${x===p.passStyle?'selected':''}>${x}</option>`).join('')}</select></label>
</div><label style="margin-top:10px">Scout notes<textarea id="notes">${esc(p.notes)}</textarea></label><div class="toolbar" style="margin-top:12px"><button class="btn primary" id="generate">Generate Call Sheet</button><button class="btn" id="reset">Reset</button></div></div>
<div class="card"><div class="kicker">Defensive Snapshot</div><h2>${esc(p.opponent)} — ${esc(p.defense)}</h2><div class="notice">${esc(preset().notes)}</div><div class="grid three" style="margin-top:14px"><div><div class="metric">${esc(preset().front)}</div><div class="metric-label">Base front</div></div><div><div class="metric">${esc(preset().coverage)}</div><div class="metric-label">Coverage</div></div><div><div class="metric">${esc(preset().pressure)}</div><div class="metric-label">Pressure</div></div></div><div class="divider"></div><div class="small muted">The fit percentages in OC Lab are recommendation scores from your selected profile and play tags — not hidden EA tendency data.</div></div></div>
<div class="card" style="margin-top:14px"><div class="row space"><div><div class="kicker">Preview</div><h2>Top situational calls</h2></div><button class="btn" id="openSheet">Open full call sheet</button></div><div class="grid three">${matrix().slice(0,6).map(r=>`<div class="call-card"><div class="small muted">${r.sit.label}</div><div class="call-title">${esc(r.primary.formation)} — ${esc(r.primary.name)}</div><div class="call-sub">${esc(r.primary.read)}</div><div class="fit" style="margin-top:7px">${r.primary.fit}% fit</div></div>`).join('')}</div></div>`;
 ['school','playbook','opponent','defense','weather','qb','ol','passStyle','notes'].forEach(id=>document.getElementById(id).onchange=e=>{state.profile[id]=e.target.value;save()});
 document.getElementById('generate').onclick=()=>{save();openTab('callsheet');toast('Call sheet generated')};document.getElementById('openSheet').onclick=()=>openTab('callsheet');document.getElementById('reset').onclick=()=>{if(confirm('Reset OC Lab to the starter offense?')){state=initial();save();toast('Reset complete')}};
}
function renderOffense(){document.getElementById('offense').innerHTML=`<div class="grid two"><div class="card"><div class="kicker">Playbook</div><h2>${esc(state.profile.playbook)} starter library</h2><div class="notice">Toggle plays on/off to define what can appear on the generated call sheet. Add custom plays for your dynasty as your offense evolves.</div><div class="play-list" style="margin-top:12px">${state.plays.map(p=>`<div class="play-row"><div><div class="formation">${esc(p.formation)}</div><div class="playname">${esc(p.name)}</div><div class="small muted">${esc(p.read)}</div></div><div class="tags">${p.tags.map(t=>`<span class="badge">${esc(t)}</span>`).join('')}</div><button class="btn small ${p.enabled?'':'ghost'}" data-toggle="${p.id}">${p.enabled?'Active':'Off'}</button></div>`).join('')}</div></div>
<div class="card"><div class="kicker">Custom Install</div><h2>Add a play</h2><div class="stack"><label>Formation<input id="newFormation" placeholder="Gun Bunch Open"></label><label>Play name<input id="newName" placeholder="Mesh Spot"></label><label>Type<select id="newType"><option>Pass</option><option>Run</option><option>RPO</option><option>Screen</option><option>Play Action</option></select></label><label>Tags (comma-separated)<input id="newTags" placeholder="man, quick, bunch, simple"></label><label>QB read / coaching point<textarea id="newRead" placeholder="Pick one side... "></textarea></label><button class="btn primary" id="addPlay">Add to offense</button></div></div></div>`;
 document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{const p=state.plays.find(x=>x.id===b.dataset.toggle);p.enabled=!p.enabled;save()});document.getElementById('addPlay').onclick=()=>{const f=document.getElementById('newFormation').value.trim(),n=document.getElementById('newName').value.trim();if(!f||!n)return toast('Formation and play name required');state.plays.push({id:uid(),enabled:true,formation:f,name:n,type:document.getElementById('newType').value,tags:document.getElementById('newTags').value.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean),read:document.getElementById('newRead').value.trim()||'Use the concept only when the look supports it.'});save();toast('Play added')};
}
function renderLive(){const opts=[['softCorners','Corners playing soft'],['manHeavy','Man coverage showing often'],['pressureHot','Pressure getting home'],['lightBox','Light box'],['lbsCrash','Linebackers crashing run'],['edgeCrash','Edge crashing hard'],['safetiesSquat','Safeties squatting underneath'],['twoHigh','Two-high shell']];const top=matrix().slice(0,9);document.getElementById('live').innerHTML=`<div class="grid two"><div class="card"><div class="kicker">In-Game Adjustments</div><h2>What are you seeing?</h2><div class="toggle-grid">${opts.map(([id,l])=>`<button class="toggle ${state.observations.includes(id)?'active':''}" data-obs="${id}">${l}</button>`).join('')}</div><div class="toolbar" style="margin-top:12px"><button class="btn primary" id="regenLive">Recalculate</button><button class="btn ghost" id="clearObs">Clear observations</button></div></div><div class="card"><div class="kicker">Next Drive</div><h2>Recommended menu</h2><div class="stack">${top.slice(0,5).map(r=>`<div class="call-card"><div class="row space"><div><div class="small muted">${r.sit.label}</div><div class="call-title">${esc(r.primary.formation)} — ${esc(r.primary.name)}</div></div><div class="fit">${r.primary.fit}%</div></div><div class="call-sub">${esc(callNote(r.sit,r.primary))}</div></div>`).join('')}</div></div></div>`;
 document.querySelectorAll('[data-obs]').forEach(b=>b.onclick=()=>{const id=b.dataset.obs;state.observations=state.observations.includes(id)?state.observations.filter(x=>x!==id):[...state.observations,id];save()});document.getElementById('regenLive').onclick=()=>{save();toast('Next-drive recommendations updated')};document.getElementById('clearObs').onclick=()=>{state.observations=[];save()};
}
function renderCallSheet(){const m=matrix(),forms=formationRanks(),script=openingScript(),p=state.profile;const leftProfile=`<div class="sheet-section-title">Defensive Profile</div><div class="profile-list"><div><div class="profile-label">Base Structure</div><div class="profile-value">• ${esc(p.defense)}</div></div><div><div class="profile-label">Weather</div><div class="profile-value">• ${esc(p.weather||'Normal')}</div></div><div><div class="profile-label">Your Personnel</div><ul class="profile-bullets"><li>${esc(p.qb)}</li><li>${esc(p.ol)} OL</li><li>${esc(p.passStyle)} pass identity</li></ul></div><div><div class="profile-label">Key Plan</div><div class="profile-value">${esc(coachSummary())}</div></div></div><div class="sheet-section-title" style="margin-top:18px">Top Formations</div>${forms.map((f,i)=>`<div class="formation-item"><div class="formation-top"><div><span class="formation-rank">#${i+1}</span> <span class="formation-name">${esc(f.name)}</span></div><div class="formation-share">${f.avg}%</div></div><div class="formation-note">Average matchup fit across the core down-and-distance menu. Lean here, but let the defensive look decide the actual call.</div></div>`).join('')}`;
 const page1=`<article class="sheet"><div class="sheet-header"><div><div class="sheet-brand">OC LAB</div><h1>OFFENSIVE CALL SHEET</h1><div style="font-size:.72rem;color:#617080">CFB 27 Offensive Game Planner — Game Preparation</div></div><div class="sheet-meta"><strong>${esc(p.opponent)}</strong><br>${esc(p.school)} · ${esc(p.playbook)}<br>Defense: ${esc(p.defense)}</div></div><div class="sheet-grid"><aside>${leftProfile}</aside><section><div class="sheet-section-title">Down & Distance Matrix</div><table class="matrix"><thead><tr><th>Situation</th><th>Primary Call</th><th>Fit</th><th>Secondary Call</th><th>Fit</th></tr></thead><tbody>${m.map(r=>`<tr><td class="sit">${r.sit.label}</td><td><div class="call">${esc(r.primary.formation)}</div><div class="play">${esc(r.primary.name)}</div></td><td class="pct">${r.primary.fit}%</td><td><div class="call">${esc(r.secondary?.formation||'—')}</div><div class="play">${esc(r.secondary?.name||'—')}</div></td><td class="pct">${r.secondary?.fit||'—'}${r.secondary?'%':''}</td></tr><tr class="note-row"><td colspan="5"><strong>OC:</strong> ${esc(callNote(r.sit,r.primary))}</td></tr>`).join('')}</tbody></table></section></div><div class="footer"><span>OC Lab · CFB 27 Offensive Game Prep</span><span>Page 1 of 2</span></div></article>`;
 const page2=`<article class="sheet"><div class="sheet-header"><div><div class="sheet-brand">OC LAB</div><h1>SITUATIONAL COACHING GUIDE</h1><div style="font-size:.72rem;color:#617080">QB keys · leverage · pressure answers · call checks</div></div><div class="sheet-meta"><strong>${esc(p.opponent)}</strong><br>${esc(p.defense)}</div></div>${m.map(r=>`<div class="guide-item"><div class="guide-sit">${r.sit.label}</div><div class="guide-call">CALL · ${esc(r.primary.formation)} — ${esc(r.primary.name)} · ${r.primary.fit}% fit</div><div class="guide-label">OFFENSIVE KEYS</div><div class="guide-text">${esc(callNote(r.sit,r.primary))} <strong>QB:</strong> ${esc(r.primary.read)}</div></div>`).join('')}<div class="sheet-section-title" style="margin-top:18px">Opening Script — Flexible, Not Automatic</div><div class="script-grid">${script.map((p,i)=>`<div class="script-box"><div class="script-num">CALL ${i+1}</div><div class="script-call">${esc(p.formation)} — ${esc(p.name)}</div><div class="script-check">${esc(p.read)}</div></div>`).join('')}</div><div class="footer"><span>Use the opening list to gather information. Skip a call when the pre-snap look makes it a bad answer.</span><span>Page 2 of 2</span></div></article>`;
 document.getElementById('callsheet').innerHTML=`<div class="no-print card" style="margin-bottom:14px"><div class="row space"><div><div class="kicker">Generated Game Plan</div><h2>${esc(p.school)} vs ${esc(p.opponent)}</h2><div class="small muted">Fit scores update whenever you change the defense, personnel, play library, or live observations.</div></div><div class="toolbar"><button class="btn primary" id="printBtn">Print / Save PDF</button><button class="btn" id="backPlanner">Edit profile</button></div></div></div><div class="sheet-wrap">${page1}${page2}</div>`;
 document.getElementById('printBtn').onclick=()=>window.print();document.getElementById('backPlanner').onclick=()=>openTab('planner');
}
function openTab(id){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.view===id));document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===id));window.scrollTo({top:0,behavior:'smooth'})}
function renderAll(){document.getElementById('headerPill').textContent=`${state.profile.school} · ${state.profile.playbook}`;renderPlanner();renderCallSheet();renderOffense();renderLive();bindTabs()}
renderAll();
</script>
</body>
</html>
